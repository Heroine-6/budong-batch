logging {
  level = "info"
}

loki.write "default" {
  endpoint {
    url = "http://loki:3100/loki/api/v1/push"
  }
}

local.file_match "batch_logs" {
  path_targets = [
    {
      __path__ = "/var/log/app/batch.log",
      service  = "batch",
      env      = "dev",
    },
  ]
}

loki.source.file "batch_logs" {
    targets    = local.file_match.batch_logs.targets
    forward_to = [loki.process.batch.receiver]
}

loki.process "batch" {

stage.json {
  expressions = {
    level   = "level"
    logger  = "logger"
    message = "message"
  }
}

stage.labels {
  values = {
  level = ""
  }
}

forward_to = [loki.write.default.receiver]
}
